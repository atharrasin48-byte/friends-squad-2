<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login — Friends Squad 2.0</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Arial,sans-serif;color:#f5f7ff;background:linear-gradient(135deg,#090d1a,#17254a)}.panel{width:min(460px,100%);padding:26px;background:#ffffff12;border:1px solid #ffffff25;border-radius:22px}h1,h2{color:#20d9c4;text-align:center}label{display:block;margin:14px 0 5px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff35;background:#0d1428;color:white}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#7c5cff;color:white;font-weight:bold}.muted{color:#bdc7df;text-align:center}.status{margin-top:14px;padding:12px;border-radius:10px;background:#0d1428;white-space:pre-wrap}a{color:#20d9c4}</style></head>
<body><main class="panel"><h1>Friends Squad 2.0</h1><h2>Member Login</h2><p class="muted">অনুমোদিত সদস্যরা এখানে লগইন করবে।</p>
<form id="loginForm"><label>ইমেইল</label><input id="email" type="email" autocomplete="email" required><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Login</button></form>
<button id="reset" type="button" style="background:#334155">পাসওয়ার্ড ভুলে গেছ?</button><div id="status" class="status" role="status">লগইন করতে তোমার রেজিস্ট্রেশনের ইমেইল ও পাসওয়ার্ড ব্যবহার করো।</div>
<p class="muted"><a href="./registration.html">নতুন অ্যাকাউন্ট তৈরি করো</a> · <a href="./index.html">হোমপেজ</a></p></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script>
<script>
if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),status=document.getElementById("status");
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const btn=e.currentTarget.querySelector("button");btn.disabled=true;try{const email=document.getElementById("email").value.trim().toLowerCase();const password=document.getElementById("password").value;const cred=await auth.signInWithEmailAndPassword(email,password);const snap=await db.collection("memberAccounts").doc(cred.user.uid).get();if(!snap.exists||snap.data().approved!==true){status.textContent="তোমার আবেদন এখনো Admin অনুমোদন করেনি। অনুমোদনের পর আবার লগইন করো।";return;}const member=snap.data();status.textContent="স্বাগতম, "+(member.name||"সদস্য")+"! তোমার অ্যাকাউন্ট অনুমোদিত।";}catch(err){status.textContent=err.message;}finally{btn.disabled=false;}});
document.getElementById("reset").onclick=async()=>{const email=document.getElementById("email").value.trim();if(!email){status.textContent="আগে ইমেইল ঠিকানা লিখো।";return;}try{await auth.sendPasswordResetEmail(email);status.textContent="পাসওয়ার্ড রিসেট করার ইমেইল পাঠানো হয়েছে।";}catch(err){status.textContent=err.message;}};
</script></body></html>
